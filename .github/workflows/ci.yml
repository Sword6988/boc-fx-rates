name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 同一 workflow+ref 串行执行：连推标签时不并发构建/创建 Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 测试以纯标准库为主；GUI 相关断言在 Linux 上会自动跳过，仅跑纯函数部分
      - run: python run_tests.py

  # 推送 v* 标签时：测试通过后构建 exe 并创建 GitHub Release 附件
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # pip 缓存：PyInstaller 安装命中缓存，省 1 分钟左右
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # 构建前校验 tag 与 version_info.txt 一致：避免产出「文件名版本 ≠ exe
      # 内版本」的错版 Release（v1.9.2 → 期望 FileVersion 1.9.2.0）
      - name: Verify tag matches version_info.txt
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Tag '$tag' does not look like vX.Y.Z"
          }
          $expected = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $vi = Get-Content -LiteralPath version_info.txt -Raw
          if ($vi -notmatch [regex]::Escape("StringStruct('FileVersion', '$expected')")) {
            throw "version_info.txt FileVersion != tag $tag (expected '$expected')"
          }
          Write-Host "Version check OK: $expected"
      - name: Install PyInstaller
        run: pip install -r requirements-dev.txt
      # GUI 冒烟：exe 构建前先在 runner 上验证程序能启动（含 tkinter/DPI/
      # 单实例/界面构建全链路），6 秒后自动退出；失败则不产出新 Release
      - name: Smoke test (selftest)
        run: python boc_fx_rates.py --selftest
      - name: Build exe
        run: >
          python -m PyInstaller --onefile --windowed --clean
          --name 中行汇率换算 --icon app_icon.ico
          --add-data "app_icon.ico;." --version-file version_info.txt
          boc_fx_rates.py
      # ASCII asset name with version (softprops mangles non-ASCII names)
      - name: Rename exe for release
        shell: pwsh
        run: >
          Copy-Item "dist\中行汇率换算.exe"
          ("boc-fx-rates-{0}.exe" -f ${env:GITHUB_REF_NAME})
      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: boc-fx-rates-*.exe
